name: Sync pricing from TOLVYN

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily (after TOLVYN's nightly scrape at 03:00)
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write  # needed for the sync job to push pricing updates back to main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # explicit; required so the push step can reuse the token

      - name: Fetch current pricing from TOLVYN operator API
        id: fetch
        env:
          TOLVYN_OPERATOR_TOKEN: ${{ secrets.TOLVYN_OPERATOR_TOKEN }}
        run: |
          # Don't use `set -e` for this step — we want to handle failures gracefully.
          set +e

          if [ -z "$TOLVYN_OPERATOR_TOKEN" ]; then
            echo "::warning::TOLVYN_OPERATOR_TOKEN secret is not set — skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture body and HTTP status separately. -s silences progress, NO -f
          # so we still get the body on error responses.
          HTTP_STATUS=$(curl -s -o /tmp/tolvyn_models.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $TOLVYN_OPERATOR_TOKEN" \
            --max-time 30 \
            "https://api.tolvyn.io/v1/operator/models")
          CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::curl failed with exit code $CURL_EXIT (network or DNS issue) — skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auth failures are NOT transient — a stale/revoked TOLVYN_OPERATOR_TOKEN
          # would otherwise be swallowed by the graceful skip below and silently
          # freeze the pricing DB (see the 2026-07-05 → 07-09 incident, where the
          # sync 401'd for five days while every run still reported "success").
          # Fail the job loudly so a token mismatch is visible immediately.
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            BODY_PREVIEW=$(head -c 500 /tmp/tolvyn_models.json 2>/dev/null || echo "(empty)")
            echo "::error::TOLVYN API returned HTTP $HTTP_STATUS (auth failure) — the TOLVYN_OPERATOR_TOKEN secret is stale or revoked. Update it to match the server and re-run."
            echo "Response preview: $BODY_PREVIEW"
            exit 1
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            BODY_PREVIEW=$(head -c 500 /tmp/tolvyn_models.json 2>/dev/null || echo "(empty)")
            echo "::warning::TOLVYN API returned HTTP $HTTP_STATUS — skipping sync"
            echo "Response preview: $BODY_PREVIEW"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Validate that the response is parseable JSON containing model rows.
          # The endpoint returns a bare JSON array; older formats wrapped in
          # {data: [...]} or {models: [...]} are also accepted defensively.
          if ! jq -e 'type == "array" or (type == "object" and (has("data") or has("models")))' /tmp/tolvyn_models.json > /dev/null 2>&1; then
            BODY_PREVIEW=$(head -c 500 /tmp/tolvyn_models.json)
            echo "::warning::TOLVYN API returned unexpected payload shape — skipping sync"
            echo "Response preview: $BODY_PREVIEW"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODEL_COUNT=$(jq 'if type == "array" then length else (.data // .models) | length end' /tmp/tolvyn_models.json)
          echo "Fetched $MODEL_COUNT models (HTTP $HTTP_STATUS)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "model_count=$MODEL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Update model JSON files
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 scripts/update_models.py /tmp/tolvyn_models.json

      - name: Update index.json
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 scripts/build_index.py

      - name: Commit if changed
        if: steps.fetch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "tolvyn-bot"
          git config user.email "bot@tolvyn.io"

          # Switch the remote to HTTPS with the token baked into the URL.
          # actions/checkout@v4 normally sets up http.extraheader for auth, but
          # we hit exit-128 "could not read Username for github.com" on
          # 2026-05-23 the first time the sync produced a non-empty diff.
          # Token-in-URL is the most robust fallback — it doesn't depend on
          # whatever git config the action installed.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add models/ index.json
          if git diff --staged --quiet; then
            echo "No pricing changes detected — nothing to commit"
          else
            git commit -m "chore: sync pricing $(date -u +%Y-%m-%d)"
            git push
            echo "::notice::Pricing changes committed for $(date -u +%Y-%m-%d)"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.fetch.outputs.skip }}" = "true" ]; then
            echo "### ⚠️ Sync skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the **Fetch current pricing** step warnings for the reason (auth, network, or payload shape)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✓ Sync completed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Models fetched: ${{ steps.fetch.outputs.model_count }}" >> "$GITHUB_STEP_SUMMARY"
          fi

# NOTE: The set-topics job was removed. Modifying repository topics requires
# a PAT with the `repo` scope — `GITHUB_TOKEN` cannot do it. Topics were set
# once via the initial PAT-authenticated run (commit 3133cf0); they persist
# at the repo level and don't need re-application. If topics need updating,
# either use `gh repo edit tolvyn/tolvyn-models --add-topic <topic>` locally
# or run a one-off workflow with a PAT secret.
